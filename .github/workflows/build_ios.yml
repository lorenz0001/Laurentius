name: Build iOS IPA

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-ipa:
    name: Build iOS IPA
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Create placeholder .env file
        run: |
          echo "DEEPSEEK_API_KEY=" > .env
          echo "DEEPSEEK_BASE_URL=https://api.deepseek.com" >> .env
          echo "DEEPSEEK_MODEL=deepseek-v4-flash" >> .env

      - name: Install dependencies
        run: flutter pub get

      - name: Generate Isar and build_runner code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Install CocoaPods dependencies
        run: |
          cd ios
          pod install
          cd ..

      - name: Build iOS Application (unsigned)
        run: |
          # Build with xcodebuild directly, bypassing Flutter's team check
          # Flutter's build files are generated via the Xcode build phases
          xcodebuild \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath build/ios/Runner.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            archive

      - name: Package IPA
        run: |
          mkdir -p build/ios/ipa/Payload
          # Extract .app from the xcarchive
          cp -r build/ios/Runner.xcarchive/Products/Applications/Runner.app build/ios/ipa/Payload/
          cd build/ios/ipa
          zip -r Laurentius.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Laurentius-iOS-IPA
          path: build/ios/ipa/Laurentius.ipa
          retention-days: 14