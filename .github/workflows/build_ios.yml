name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-ipa:
    name: Build iOS IPA
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate Isar and build_runner code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Install CocoaPods dependencies
        run: |
          cd ios
          pod install
          cd ..

      - name: Build iOS Application (Simulator workaround)
        # Compiliamo per simulatore. Il simulatore non richiede MAI code signing.
        # Rimuoviamo --release perché il simulatore usa --debug per default
        run: flutter build ios --simulator --no-codesign

      - name: Package IPA
        run: |
          # Creiamo la struttura standard dell'IPA
          mkdir -p build/ios/ipa/Payload
          
          # Copiamo la build del simulatore nella cartella Payload
          cp -r build/ios/iphonesimulator/Runner.app build/ios/ipa/Payload/
          
          # Navighiamo e zippiamo il contenuto
          cd build/ios/ipa
          zip -r Laurentius.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Laurentius-iOS-IPA
          path: build/ios/ipa/Laurentius.ipa
          retention-days: 14